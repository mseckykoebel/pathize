name: Deploy @pathize/api to staging

on:
  push:
    branches: [staging, feat/finalize-chat-mvp]

jobs:
  deploy:
    name: Deploy server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: "flyctl deploy --remote-only --config apps/api/fly/staging/fly.toml"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}